<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة التاجر | شركة المتوكل</title>
    <!-- Telegram Mini App WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f8f9fa);
            --text-color: var(--tg-theme-text-color, #212529);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --primary-color: var(--tg-theme-button-color, #1f6feb);
            --primary-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #6c757d);
            --border-color: #e9ecef;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color);
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 18px;
            color: var(--primary-color);
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            background-color: var(--bg-color);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--primary-text);
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s ease;
        }

        button:active {
            opacity: 0.85;
        }

        .result {
            margin-top: 20px;
            padding: 14px;
            background: rgba(31, 111, 235, 0.08);
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.7;
            display: none;
            border-right: 4px solid var(--primary-color);
        }

        .result p {
            margin: 6px 0;
        }

        .footer-sponsor {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px dashed var(--border-color);
            text-align: center;
            font-size: 13px;
            color: var(--hint-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة التكلفة والربح</h2>
    
    <div class="form-group">
        <label for="price">سعر شراء الوحدة / الطن:</label>
        <input type="number" id="price" placeholder="أدخل سعر الشراء" inputmode="decimal">
    </div>

    <div class="form-group">
        <label for="quantity">الكمية الإجمالية:</label>
        <input type="number" id="quantity" placeholder="أدخل عدد الوحدات أو الأطنان" inputmode="decimal">
    </div>

    <div class="form-group">
        <label for="delivery">تكلفة النقل والشحن الإجمالية:</label>
        <input type="number" id="delivery" placeholder="أدخل تكلفة النقل" inputmode="decimal">
    </div>

    <div class="form-group">
        <label for="other">مصروفات أخرى (عمالة، مشال، عتق):</label>
        <input type="number" id="other" placeholder="أدخل أي مصروفات إضافية" inputmode="decimal">
    </div>

    <div class="form-group">
        <label for="profitMargin">نسبة الربح المطلوبة (%):</label>
        <input type="number" id="profitMargin" placeholder="مثال: 10" inputmode="decimal">
    </div>

    <button type="button" onclick="calculate()">حساب التكلفة والسعر النهائي</button>

    <div class="result" id="resultBox">
        <p>• إجمالي التكلفة الشاملة: <strong id="resTotalCost">0</strong></p>
        <p>• التكلفة الفعلية للوحدة / الطن: <strong id="resUnitCost">0</strong></p>
        <p>• 💰 <strong>سعر البيع المقترح للوحدة:</strong> <strong id="resFinalPrice" style="color: var(--primary-color);">0</strong></p>
        <p>• صافي ربح الوحدة / الطن: <strong id="resUnitProfit">0</strong></p>
        <p>• إجمالي الربح المتوقع للكمية: <strong id="resTotalProfit">0</strong></p>
    </div>

    <div class="footer-sponsor">
        برعاية @AbuObeidaFeeds
    </div>
</div>

<script>
    // تهيئة تطبيق تليجرام المصغر
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    function calculate() {
        const price = parseFloat(document.getElementById('price').value) || 0;
        const quantity = parseFloat(document.getElementById('quantity').value) || 1;
        const delivery = parseFloat(document.getElementById('delivery').value) || 0;
        const other = parseFloat(document.getElementById('other').value) || 0;
        const profitMargin = parseFloat(document.getElementById('profitMargin').value) || 0;

        const totalGoods = price * quantity;
        const totalExpenses = delivery + other;
        const totalCost = totalGoods + totalExpenses;
        const actualUnitCost = totalCost / quantity;
        const finalSellingPrice = actualUnitCost * (1 + (profitMargin / 100));
        const unitProfit = finalSellingPrice - actualUnitCost;
        const totalProfit = unitProfit * quantity;

        document.getElementById('resTotalCost').innerText = totalCost.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
        document.getElementById('resUnitCost').innerText = actualUnitCost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('resFinalPrice').innerText = finalSellingPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('resUnitProfit').innerText = unitProfit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('resTotalProfit').innerText = totalProfit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
