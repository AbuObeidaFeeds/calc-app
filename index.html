<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحاسبة التجارية الذكية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--tg-theme-button-color, #2481cc);
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            background: inherit;
            color: inherit;
        }
        button {
            width: 100%;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .result {
            margin-top: 20px;
            padding: 12px;
            background: rgba(36, 129, 204, 0.1);
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }
        .result p {
            margin: 6px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة التسعير التجارية</h2>
    
    <div class="form-group">
        <label>سعر شراء الوحدة / الطن:</label>
        <input type="number" id="price" placeholder="أدخل السعر">
    </div>

    <div class="form-group">
        <label>الكمية الإجمالية:</label>
        <input type="number" id="quantity" placeholder="أدخل الكمية">
    </div>

    <div class="form-group">
        <label>تكلفة التوصيل والشحن الإجمالية:</label>
        <input type="number" id="delivery" placeholder="أدخل التكلفة">
    </div>

    <div class="form-group">
        <label>مصروفات أخرى (عمالة، تحميل...):</label>
        <input type="number" id="other" placeholder="أدخل المصروفات">
    </div>

    <div class="form-group">
        <label>نسبة الربح المطلوبة (%):</label>
        <input type="number" id="profitMargin" placeholder="مثال: 15">
    </div>

    <button onclick="calculate()">احساب التكلفة والسعر النهائي</button>

    <div class="result" id="resultBox">
        <p>• إجمالي التكلفة الشاملة: <strong id="resTotalCost">0</strong></p>
        <p>• التكلفة الفعلية للوحدة/الطن: <strong id="resUnitCost">0</strong></p>
        <p>• 💰 <strong>سعر البيع النهائي:</strong> <strong id="resFinalPrice" style="color: #2481cc;">0</strong></p>
        <p>• ربح الوحدة الواحدة: <strong id="resUnitProfit">0</strong></p>
        <p>• إجمالي الربح المتوقع: <strong id="resTotalProfit">0</strong></p>
    </div>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    function calculate() {
        let price = parseFloat(document.getElementById('price').value) || 0;
        let quantity = parseFloat(document.getElementById('quantity').value) || 1;
        let delivery = parseFloat(document.getElementById('delivery').value) || 0;
        let other = parseFloat(document.getElementById('other').value) || 0;
        let profitMargin = parseFloat(document.getElementById('profitMargin').value) || 0;

        let totalGoods = price * quantity;
        let totalExpenses = delivery + other;
        let totalCost = totalGoods + totalExpenses;
        let actualUnitCost = totalCost / quantity;
        let finalSellingPrice = actualUnitCost * (1 + (profitMargin / 100));
        let unitProfit = finalSellingPrice - actualUnitCost;
        let totalProfit = unitProfit * quantity;

        document.getElementById('resTotalCost').innerText = totalCost.toLocaleString();
        document.getElementById('resUnitCost').innerText = actualUnitCost.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('resFinalPrice').innerText = finalSellingPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('resUnitProfit').innerText = unitProfit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('resTotalProfit').innerText = totalProfit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
