<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2481cc">
    <meta name="referrer" content="no-referrer">
    <title>الحاسبة التجارية</title>
    <link rel="preconnect" href="https://telegram.org" crossorigin>
    <link rel="dns-prefetch" href="https://telegram.org">
    <!-- async: لا يحجب العرض أبداً -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
    <style>
        *,*::before,*::after{box-sizing:border-box}
        body{
            font-family:system-ui,-apple-system,sans-serif;
            background:var(--tg-theme-bg-color,#f5f5f5);
            color:var(--tg-theme-text-color,#222);
            margin:0;padding:16px;
            -webkit-tap-highlight-color:transparent;
        }
        .container{
            max-width:400px;margin:0 auto;
            background:var(--tg-theme-secondary-bg-color,#fff);
            padding:20px;border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,.05);
        }
        h2{text-align:center;font-size:20px;margin:0 0 20px;color:var(--tg-theme-button-color,#2481cc)}
        .form-group{margin-bottom:12px}
        label{display:block;margin-bottom:6px;font-size:14px;font-weight:700}
        input{
            width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;
            font-size:16px;background:inherit;color:inherit;outline:none;
            -webkit-appearance:none;appearance:none;
        }
        input:focus{border-color:var(--tg-theme-button-color,#2481cc)}
        button{
            width:100%;background:var(--tg-theme-button-color,#2481cc);
            color:var(--tg-theme-button-text-color,#fff);border:0;
            padding:12px;border-radius:8px;font-size:16px;font-weight:700;
            cursor:pointer;margin-top:10px;
            -webkit-appearance:none;appearance:none;
        }
        button:active{opacity:.85}
        .result{
            margin-top:20px;padding:12px;background:rgba(36,129,204,.1);
            border-radius:8px;font-size:14px;line-height:1.6;
        }
        .result p{margin:6px 0}
        .result[hidden]{display:none}
        #resFinalPrice{color:#2481cc}
        .footer-sponsor{
            margin-top:20px;padding-top:15px;border-top:1px dashed #ccc;
            text-align:center;font-size:13px;color:var(--tg-theme-hint-color,#666);
        }
        .footer-sponsor a{color:var(--tg-theme-link-color,#2481cc);text-decoration:none;font-weight:700}
        .error{
            display:none;color:#e53935;font-size:14px;padding:8px;
            background:rgba(229,57,53,.1);border-radius:8px;
            margin-top:10px;text-align:center;
        }
        .error.show{display:block}
    </style>
</head>
<body>
<div class="container">
    <h2>حاسبة التسعير التجارية</h2>

    <form id="calcForm" novalidate>
        <div class="form-group">
            <label for="price">سعر شراء الوحدة:</label>
            <input id="price" type="number" inputmode="decimal" step="any" min="0" placeholder="أدخل السعر" autocomplete="off" required>
        </div>
        <div class="form-group">
            <label for="quantity">الكمية (عدد الوحدات):</label>
            <input id="quantity" type="number" inputmode="decimal" step="any" min="0" placeholder="أدخل الكمية" autocomplete="off" required>
        </div>
        <div class="form-group">
            <label for="delivery">تكلفة التوصيل والشحن الإجمالية:</label>
            <input id="delivery" type="number" inputmode="decimal" step="any" min="0" placeholder="أدخل التكلفة" autocomplete="off" value="0">
        </div>
        <div class="form-group">
            <label for="other">مصروفات أخرى (عمالة، تحميل...):</label>
            <input id="other" type="number" inputmode="decimal" step="any" min="0" placeholder="أدخل المصروفات" autocomplete="off" value="0">
        </div>
        <div class="form-group">
            <label for="profitMargin">نسبة الربح المطلوبة (%):</label>
            <input id="profitMargin" type="number" inputmode="decimal" step="any" min="0" placeholder="مثال: 15" autocomplete="off" value="0">
        </div>
        <button type="submit">حساب التكلفة والسعر النهائي</button>
    </form>

    <div class="error" id="errorMsg"></div>

    <div class="result" id="resultBox" hidden>
        <p>• إجمالي التكلفة الشاملة: <strong id="resTotalCost">0</strong></p>
        <p>• التكلفة الفعلية للوحدة: <strong id="resUnitCost">0</strong></p>
        <p>• 💰 <strong>سعر البيع النهائي:</strong> <strong id="resFinalPrice">0</strong></p>
        <p>• ربح الوحدة الواحدة: <strong id="resUnitProfit">0</strong></p>
        <p>• إجمالي الربح المتوقع: <strong id="resTotalProfit">0</strong></p>
    </div>

    <div class="footer-sponsor">
        برعاية: <a id="sponsorLink" href="https://t.me/AbuObeidaFeeds" target="_blank" rel="noopener noreferrer">@AbuObeidaFeeds</a>
    </div>
</div>

<script>
(function () {
    'use strict';

    /* ---------- 1) تخزين مراجع DOM مرة واحدة ---------- */
    const $ = id => document.getElementById(id);
    const els = {
        form: $('calcForm'),
        price: $('price'),
        quantity: $('quantity'),
        delivery: $('delivery'),
        other: $('other'),
        profitMargin: $('profitMargin'),
        resultBox: $('resultBox'),
        errorMsg: $('errorMsg'),
        sponsorLink: $('sponsorLink'),
        out: {
            totalCost: $('resTotalCost'),
            unitCost: $('resUnitCost'),
            finalPrice: $('resFinalPrice'),
            unitProfit: $('resUnitProfit'),
            totalProfit: $('resTotalProfit')
        }
    };

    /* ---------- 2) Formatters مسبقة الإنشاء (أسرع) ---------- */
    const fmtInt = new Intl.NumberFormat('en-US');
    const fmt2 = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });

    /* ---------- 3) قراءة مدخل رقمي آمنة ---------- */
    const MAX_VAL = 1e15;
    function num(el) {
        const v = parseFloat(el.value);
        if (!Number.isFinite(v)) return 0;
        return Math.min(MAX_VAL, Math.max(0, v));
    }

    /* ---------- 4) رسائل الخطأ ---------- */
    function showError(msg) {
        els.errorMsg.textContent = msg;
        els.errorMsg.classList.add('show');
        els.resultBox.hidden = true;
    }

    /* ---------- 5) الحساب ---------- */
    function calculate(e) {
        if (e) e.preventDefault();
        els.errorMsg.classList.remove('show');

        const price        = num(els.price);
        const quantity     = num(els.quantity);
        const delivery     = num(els.delivery);
        const other        = num(els.other);
        const profitMargin = num(els.profitMargin);

        if (price <= 0)    return showError('أدخل سعر شراء صحيح (أكبر من صفر)');
        if (quantity <= 0) return showError('أدخل كمية صحيحة (أكبر من صفر)');

        const totalGoods        = price * quantity;
        const totalExpenses     = delivery + other;
        const totalCost         = totalGoods + totalExpenses;
        const actualUnitCost    = totalCost / quantity;
        const finalSellingPrice = actualUnitCost * (1 + profitMargin / 100);
        const unitProfit        = finalSellingPrice - actualUnitCost;
        const totalProfit       = unitProfit * quantity;

        els.out.totalCost.textContent    = fmtInt.format(totalCost);
        els.out.unitCost.textContent     = fmt2.format(actualUnitCost);
        els.out.finalPrice.textContent   = fmt2.format(finalSellingPrice);
        els.out.unitProfit.textContent   = fmt2.format(unitProfit);
        els.out.totalProfit.textContent  = fmt2.format(totalProfit);

        els.resultBox.hidden = false;
    }

    /* ---------- 6) ربط الأحداث (بدون inline onclick) ---------- */
    els.form.addEventListener('submit', calculate);

    els.sponsorLink.addEventListener('click', function (e) {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg && typeof tg.openTelegramLink === 'function') {
            e.preventDefault();
            try { tg.openTelegramLink('https://t.me/AbuObeidaFeeds'); } catch (_) {}
        }
    });

    /* ---------- 7) تهيئة تيليجرام مع إعادة محاولة (لأن السكربت async) ---------- */
    let tgInit = false;
    function initTelegram() {
        const tg = window.Telegram && window.Telegram.WebApp;
        if (!tg || tgInit) return !!tg;
        tgInit = true;
        try {
            if (typeof tg.ready === 'function')                tg.ready();
            if (typeof tg.expand === 'function')               tg.expand();
            if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
            if (typeof tg.setHeaderColor === 'function')       tg.setHeaderColor('secondary_bg_color');
            if (typeof tg.setBackgroundColor === 'function')   tg.setBackgroundColor('bg_color');
        } catch (_) { /* تجاهل أي خطأ في نسخ تيليجرام القديمة */ }
        return true;
    }

    if (!initTelegram()) {
        let tries = 0;
        const timer = setInterval(() => {
            tries++;
            if (initTelegram() || tries > 30) clearInterval(timer);
        }, 100);
    }
})();
</script>
</body>
</html>
